# Merge-path updater (homelab FU-041): keeps the oldest armed+green PR up to date with master so
# auto-merge can fire under the strict up-to-date rule. Added 2026-07-16 after the machine-managed
# specs-pr route PRs starved BEHIND (every merge re-behinds the survivors; nothing re-updated them
# — the same FU-041 class the fleet repo hit on PR #6). Thin caller → reusable homelab workflow.
name: update-pr-branch
on:
  push: { branches: [master] }
  workflow_run: { workflows: [CI], types: [completed] }
  schedule: [{ cron: "*/15 * * * *" }]
  workflow_dispatch: {}
concurrency: { group: update-pr-branch, cancel-in-progress: false }
jobs:
  update:
    uses: teststuffstash/homelab/.github/workflows/update-pr-branch.reusable.yml@master
    secrets: inherit

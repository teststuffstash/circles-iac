# id.circles.teststuff.net → Pocket ID, the passkey login of the LAN gate (ADR-004). LAN/VPN-only
# like every *.circles name (HAProxy wildcard → circles-gateway). Wave 2: the hostname appears only
# after pocket-id-seed.yaml (wave 1) has created the first user, which closes Pocket ID's
# first-run admin signup.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: id-circles
  namespace: circles
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: circles-gateway
  hostnames:
    - id.circles.teststuff.net
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: pocket-id
          port: 80

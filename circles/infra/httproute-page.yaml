# app.circles.teststuff.net → oauth2-proxy → the circles status page (ADR-004: the LAN passkey
# gate; the page itself is the `circles-page` chart Application, apps/circles-page.yaml, and
# oauth2-proxy.yaml names it as its upstream). In-namespace backend → no ReferenceGrant; the apex
# is not covered by the gateway's `*.circles.teststuff.net` listener, hence the `app.` host.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: page-circles
  namespace: circles
spec:
  parentRefs:
    - name: circles-gateway
  hostnames:
    - app.circles.teststuff.net
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: oauth2-proxy
          port: 80

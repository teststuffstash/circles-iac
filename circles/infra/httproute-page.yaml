# app.circles.teststuff.net → the circles status page (the `circles-page` chart Application,
# apps/circles-page.yaml; the chart's Service is named after the Helm release). In-namespace
# backend → no ReferenceGrant; the apex is not covered by the gateway's `*.circles.teststuff.net`
# listener, hence the `app.` host.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: page-circles
  namespace: circles
spec:
  parentRefs:
    - name: circles-gateway
  hostnames:
    - app.circles.teststuff.net
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: circles-page
          port: 80

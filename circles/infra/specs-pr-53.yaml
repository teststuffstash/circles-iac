# specs-53.circles.teststuff.net → this circles PR's specs-site preview (bucket
# circles-specs, prefix pr-53/). Generated by circles scripts/specs-pr-route.sh; removed
# when PR #53 closes. See circles/infra/README.md.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: specs-pr-53
  namespace: circles
spec:
  parentRefs:
    - name: circles-gateway
  hostnames:
    - specs-53.circles.teststuff.net
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: circles-specs.teststuff.net
            path: { type: ReplacePrefixMatch, replacePrefixMatch: /pr-53 }
      backendRefs:
        - group: ""
          kind: Service
          name: garage-s3
          namespace: garage
          port: 3902

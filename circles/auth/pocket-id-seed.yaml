# The Pocket ID seed (ADR-004) — declares the gate's users and its one OIDC client through the
# API (/api/*, X-API-Key = STATIC_API_KEY from circles-auth). An ArgoCD Sync hook, so it re-runs on
# every sync of circles-auth; every step is an upsert by a FIXED id, so a re-run is a no-op.
#
# Wave 1: ArgoCD waits for wave 0 (Pocket ID) to be healthy. A failing seed fails the sync of the
# circles-auth Application only — it lives apart from circles-infra precisely so that the
# machine-managed specs-pr routes keep syncing whatever happens here.
#
# Security does NOT hang on this ordering: Pocket ID's first-run admin signup is blocked at the
# gateway (httproute-id.yaml) and in-cluster (the CiliumNetworkPolicy in pocket-id.yaml).
#
# What the seed does NOT do: mint a login link. A one-time-access link is a credential and would
# sit in this Job's log; scripts/passkey-login-link.sh mints it on demand instead.
#
# Users: one admin, `operator`. The email is a placeholder (Pocket ID requires one by default and
# oauth2-proxy reads the claim) — this repo is public, no personal address here.
apiVersion: batch/v1
kind: Job
metadata:
  name: pocket-id-seed
  namespace: circles
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels: { app.kubernetes.io/name: pocket-id-seed }   # admitted by pocket-id-ingress
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 100   # curl_user in curlimages/curl
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: seed
          image: docker.io/curlimages/curl:8.23.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          env:
            - { name: API, value: "http://pocket-id.circles.svc.cluster.local/api" }
            - { name: USER_ID, value: "6f1c2a3e-8b4d-4c7e-9a10-2d5e7f8a9b01" }   # fixed → idempotent
            - { name: CLIENT_ID, value: "circles-oauth2-proxy" }
            - { name: CALLBACK, value: "https://app.circles.teststuff.net/oauth2/callback" }
            - name: STATIC_API_KEY
              valueFrom: { secretKeyRef: { name: circles-auth, key: static_api_key } }
            - name: CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: circles-auth, key: oidc_client_secret } }
          command: ["/bin/sh", "-ec"]
          args:
            - |
              H="X-API-Key: $STATIC_API_KEY"
              # get <path> → prints the HTTP status, body in /tmp/body
              get() { curl -sS -o /tmp/body -w '%{http_code}' -H "$H" "$API$1"; }
              # send <method> <path> <json> → fails the Job on a non-2xx
              send() {
                code=$(curl -sS -o /tmp/body -w '%{http_code}' -X "$1" -H "$H" \
                  -H 'Content-Type: application/json' --data "$3" "$API$2")
                case "$code" in 2*) ;; *) echo "$1 $2 -> $code: $(cat /tmp/body)"; exit 1 ;; esac
              }

              until curl -sf -o /dev/null "${API%/api}/healthz"; do sleep 2; done

              # 1) the admin user
              case "$(get "/users/$USER_ID")" in
                200) echo "user: present" ;;
                404) send POST /users '{"id":"'"$USER_ID"'","username":"operator","email":"operator@circles.teststuff.net","emailVerified":true,"firstName":"Operator","isAdmin":true}'
                     echo "user: created" ;;
                *)   echo "user lookup failed: $(cat /tmp/body)"; exit 1 ;;
              esac

              # 2) the oauth2-proxy client (confidential, PKCE S256, no consent screen)
              CLIENT='{"name":"circles page","callbackURLs":["'"$CALLBACK"'"],"isPublic":false,"pkceEnabled":true,"skipConsent":true}'
              case "$(get "/oidc/clients/$CLIENT_ID")" in
                200) send PUT "/oidc/clients/$CLIENT_ID" "$CLIENT"; echo "client: updated" ;;
                404) send POST /oidc/clients "{\"id\":\"$CLIENT_ID\",${CLIENT#\{}"; echo "client: created" ;;
                *)   echo "client lookup failed: $(cat /tmp/body)"; exit 1 ;;
              esac

              # 3) its secret — ours, from circles-auth. Pocket ID returns a secret's value only at
              #    creation, but lists each secret's 4-char clear-text prefix: ours is present when
              #    a listed prefix matches. If not (first run, or a rotation), add ours, then delete
              #    every other secret — oauth2-proxy only ever holds the circles-auth one.
              want=$(printf '%.4s' "$CLIENT_SECRET")
              code=$(get "/oidc/clients/$CLIENT_ID/secrets")
              [ "$code" = 200 ] || { echo "secret list -> $code: $(cat /tmp/body)"; exit 1; }
              pairs=$(grep -o '"id":"[^"]*","prefix":"[^"]*"' /tmp/body || true)
              if printf '%s\n' "$pairs" | grep -q "\"prefix\":\"$want\"\$"; then
                echo "secret: present"
              else
                send POST "/oidc/clients/$CLIENT_ID/secrets" '{"secret":"'"$CLIENT_SECRET"'"}'
                echo "secret: created"
                printf '%s\n' "$pairs" | while IFS= read -r p; do
                  [ -n "$p" ] || continue
                  id=$(printf '%s' "$p" | sed -E 's/^"id":"([^"]*)".*/\1/')
                  send DELETE "/oidc/clients/$CLIENT_ID/secrets/$id" ''
                  echo "secret: deleted old $id"
                done
              fi

# The passkey gate's secrets (ADR-004) — minted in-cluster, never typed by anyone. Same Workspace
# shape as source-workspace.yaml: the values are random_password results held in this Workspace's
# own state, written to the connection Secret `circles-auth` in ns circles. Every consumer lives in
# this namespace, so no Infisical round-trip and no ExternalSecret (oracle-iac
# feedback-ro-workspace.yaml publishes to Infisical only because its second reader is in another
# namespace).
#
# Keys (connection Secret circles-auth):
#   encryption_key      Pocket ID ENCRYPTION_KEY (encrypts its signing keys at rest; ≥16 bytes)
#   static_api_key      Pocket ID STATIC_API_KEY — the admin credential the seed Job uses (≥16)
#   oidc_client_secret  the oauth2-proxy client's secret — supplied to Pocket ID by the seed Job,
#                       read by oauth2-proxy; never generated-and-read-back
#   cookie_secret       oauth2-proxy's cookie secret (must be exactly 16, 24 or 32 bytes)
#
# Rotation (oidc_client_secret, cookie_secret, static_api_key) is two commits: (1) bump that
# resource's `keepers.generation` and wait until circles-auth carries the new value; (2) bump
# `circles.teststuff.net/auth-secret-generation` in oauth2-proxy.yaml. Commit 2's sync rolls
# oauth2-proxy and re-runs the seed, which adds the new client secret and deletes the old one
# (pocket-id-seed.yaml step 3); pocket-id restarts on its own only for static_api_key — roll it
# by hand (`kubectl -n circles rollout restart deploy/pocket-id`) after that one.
#
# The ENCRYPTION KEY is the exception: it decrypts the signing keys inside Pocket ID's SQLite DB,
# so a new one (a recreated Workspace, lost Terraform state) bricks the gate until the DB is reset
# and every passkey re-enrolled. Hence `prevent_destroy` (a delete or replace of this Workspace's
# key fails loudly instead), and the operator keeps a copy: after the first sync,
#   kubectl -n circles get secret circles-auth -o jsonpath='{.data.encryption_key}' | base64 -d
# into the wallet as `circles-pocket-id-encryption-key`. Rotating it needs Pocket ID's
# `encryption-key-rotate` with both keys — never a generation bump.
apiVersion: tf.upbound.io/v1beta1
kind: Workspace
metadata:
  name: circles-auth-secrets
  namespace: circles
spec:
  providerConfigRef:
    name: default
  forProvider:
    source: Inline
    module: |
      resource "random_password" "encryption_key" {
        length  = 48
        special = false
        lifecycle { prevent_destroy = true }
      }
      resource "random_password" "static_api_key" {
        length  = 48
        special = false
        keepers = { generation = "1" }
      }
      resource "random_password" "oidc_client_secret" {
        length  = 48
        special = false
        keepers = { generation = "1" }
      }
      resource "random_password" "cookie_secret" {
        length  = 32   # oauth2-proxy: exactly 16/24/32 bytes
        special = false
        keepers = { generation = "1" }
      }

      output "encryption_key" {
        value     = random_password.encryption_key.result
        sensitive = true
      }
      output "static_api_key" {
        value     = random_password.static_api_key.result
        sensitive = true
      }
      output "oidc_client_secret" {
        value     = random_password.oidc_client_secret.result
        sensitive = true
      }
      output "cookie_secret" {
        value     = random_password.cookie_secret.result
        sensitive = true
      }
  writeConnectionSecretToRef:
    namespace: circles
    name: circles-auth

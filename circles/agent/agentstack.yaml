# The circles stack's AgentStack claim (homelab FU-048/ADR-085) — the stack's agent POLICY in one
# CR; homelab's XRD+Composition render the fixer MECHANISM (git-token trio, worker egress netpol,
# the standing OpenRouterKey, proxy session-key RBAC). Applied by the agent-fixer ApplicationSet.
# Docs:
#   kubectl get cm -n crossplane-system agentstack-docs -o jsonpath='{.data.USAGE\.md}'
#   homelab docs/agents/agentstack.md
#
# CHAINLESS PILOT (ADR-096 P5, 2026-08-03): this claim deliberately declares NO workerModel /
# workerModelFallbacks — the router's rotation universe supplies candidates per dispatch, and
# routerMode: authoritative makes the routed decision binding (the launcher refuses a chainless
# dispatch in shadow/off). Do not "fix" this by adding a chain; that would regress the pilot to
# the static-chain shape (the point of circles is router-routed rides from day one).
apiVersion: platform.teststuff.net/v1alpha1
kind: AgentStack
metadata:
  name: circles
spec:
  mainRepo: circles # coordinator cwd — circles/CLAUDE.md + specs/ are the session's context
  coordinatorModel: sonnet
  coordinator:
    # ON since 2026-08-05 (operator). The seeding rule this was holding for — one trivial
    # hand-authored PR through CI → review → auto-merge E2E before any loop dispatch — is
    # deliberately NOT the gate any more: circles' first implementation work lands on the
    # research/issue-1-weave branch, not master, and those rides are human-gated by construction
    # (a declared `Base:` makes the launcher refuse to arm auto-merge), so the first supervised
    # rides ARE the proof. The merge path itself stays unexercised until the weave merges — that
    # is the residual risk of flipping here, and it is accepted knowingly, not overlooked.
    enabled: true
  reviewer:
    enabled: true # server default, explicit so the stamped bool doesn't drift ArgoCD OutOfSync
    goalModel: sonnet   # declared-not-defaulted (M10; same drift class, 2026-08-12)
  loop:
    perStack: true # FU-080 shape from day one: the loop machinery renders in circles-agents
    # graduated flipped WITH coordinator.enabled 2026-08-05, and the line below said to do exactly
    # that. Flipping enabled alone (10:41) left BOTH scanners owning circles — the global belt in
    # agent-coordinator and the per-stack coordinate-circles — and they raced issue #17 within four
    # minutes: three coordinator sessions, two redundant claim comments, one wasted opus session.
    # No duplicate WORKER: the launcher's WIP-limit pre-flight refused the second spawn, which is
    # the only reason this cost tokens instead of two concurrent rides on one issue.
    graduated: true # per-stack loop owns circles now; the global scan skips it (doorbell + in-ns review)
  routerMode: authoritative # REQUIRED for chainless (see header)
  modelDeny: [] # explicit (server default) — ArgoCD diff hygiene
  # No slo: block yet — there is no live endpoint to probe (the vanilla chart deploys the hello
  # page but no LAN hostname is routed). Declare it with the first real exposure so the blackbox
  # probe + error-budget teeth attach to something that exists.
  repos:
    - name: circles-iac # context-only: CI deploys this repo, agents never run pods in it (FU-052 exclusion)
      labels: { extra: [] } # taxonomy only; explicit extra (server default) — bare {} stamps to {extra: []}, ArgoCD drifts
    - name: circles
      labels: { extra: [] } # track/* lanes arrive with specs/TRACKS.md — claim-owned when they do (FU-068)
      # ADR-089 quota-as-contract, ARMED 2026-08-07. The XRD has carried these caps since day one
      # and NO claim ever set one, so `kubectl get resourcequota -A` was empty cluster-wide and the
      # "over-cap PVC fails fast at CREATE with a legible error" promise was never actually in
      # force. Unbounded is what produced 2026-07-25: nine rides held 9x20Gi of scratch at once,
      # pushed both bulk disks past the scheduling cap, and wedged every later ride in Init.
      # scratch = 20Gi x 3 concurrent docker rides (the circles#19 kind gate needs a real daemon).
      storage:
        standard: "5Gi"
        scratch: "60Gi"
        bulk: "0"
        fast: "0" # declared-not-defaulted: omitted server-default fields drift the app OutOfSync (homelab agent-fixer.yaml doctrine, 2026-08-12)
      fixer:
        budgetUSD: 5 # USD/week standing ceiling; per-session ephemeral keys budget underneath it
        resetInterval: weekly
        guardrail: none # explicit — the XRD defaults to only-free and would stamp the restriction back if omitted. Opened 2026-08-04 (operator): the FU-126 comparison runs use paid models (no free deepseek variant exists) and only-free 403s them before spend; budgetUSD above stays the standing-key ceiling, session keys still carry their own caps.
        # Chainless + research rides need the subscription rail available: renders the
        # claude-session ExternalSecret (session-key-labeled) so a routed claude/<alias> dispatch
        # — and the FU-105/FU-126 researcher rides — can run here (FU-066 leg a).
        claudeTier: true
        docker: true # circles#19 builds the kind system-testing gate — the first docker-needing gate, so this flips (kata microVM + dind sidecar; the launcher auto-derives --docker from this claim)
        egress:
          profile: none # static page + helm gate: baseline egress only (no pypi)
          extraFQDNs: [] # explicit (server default) — earned from a harvest, currently none
          enforce: false # MONITOR first, like every new fixer ns (FU-020 rollout rings)
